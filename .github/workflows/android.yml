name: Build Prasad Label Studio Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate web app JavaScript
        run: |
          for f in app/src/main/assets/www/*.js; do node --check "$f"; done

      - name: Run barcode and printing logic tests
        run: |
          J=app/src/main/java/com/prasad/labelstudio
          mkdir -p /tmp/core_out
          javac -Xlint:all -d /tmp/core_out $J/BarcodeSequence.java $J/Tokens.java $J/LabelJob.java $J/JsonText.java $J/PrintCoordinator.java $J/RasterCodec.java $J/CodeSvg.java tests/CoreTests.java
          java -cp /tmp/core_out com.prasad.labelstudio.CoreTests

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prasad-Label-Studio-Android
          path: app/build/outputs/apk/debug/app-debug.apk
